name: Build Robot Comms firmware

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'source/public/firmware/robot-comms/**'
      - '.github/workflows/robot-comms-firmware.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install MakeCode compiler
        run: npm install --prefix "$RUNNER_TEMP/makecode" --no-audit --no-fund makecode@1.3.6

      - name: Compile micro:bit firmware
        working-directory: source/public/firmware/robot-comms
        run: node "$RUNNER_TEMP/makecode/node_modules/makecode/makecode" build

      - name: Package flashable HEX
        working-directory: source/public/firmware/robot-comms
        run: |
          test -s built/binary.hex
          mkdir -p "$RUNNER_TEMP/robot-comms-firmware"
          cp built/binary.hex "$RUNNER_TEMP/robot-comms-firmware/robot-comms.hex"
          cd "$RUNNER_TEMP/robot-comms-firmware"
          sha256sum robot-comms.hex > robot-comms.hex.sha256

      - name: Upload firmware download
        uses: actions/upload-artifact@v4
        with:
          name: robot-comms-firmware
          path: ${{ runner.temp }}/robot-comms-firmware/
          if-no-files-found: error
          retention-days: 90
